<svg width="160" height="160" viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Seamless Luxury Interlocking Arch Lattice Pattern -->
  <defs>
    <style>
      .lattice-stroke {
        stroke: #D6CEBE;
        stroke-width: 1.4;
        stroke-opacity: 0.45;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      .lattice-accent {
        stroke: #B08D57;
        stroke-width: 1.0;
        stroke-opacity: 0.25;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
    </style>
  </defs>

  <!-- Vertical backbone lines -->
  <line x1="80" y1="0" x2="80" y2="160" class="lattice-stroke" />
  <line x1="0" y1="0" x2="0" y2="160" class="lattice-stroke" />
  <line x1="160" y1="0" x2="160" y2="160" class="lattice-stroke" />

  <!-- Primary Arch 1: Centered at (80,0) curving downward to (0,80) and (160,80) -->
  <path d="M 0 80 C 0 35.8 35.8 0 80 0 C 124.2 0 160 35.8 160 80" class="lattice-stroke" />

  <!-- Primary Arch 2: Centered at (80,160) curving upward to (0,80) and (160,80) -->
  <path d="M 0 80 C 0 124.2 35.8 160 80 160 C 124.2 160 160 124.2 160 80" class="lattice-stroke" />

  <!-- Interlocking Secondary Arches centered on corners meeting at (80,80) -->
  <!-- Top corners to (80,80) -->
  <path d="M 0 0 C 44.2 0 80 35.8 80 80" class="lattice-stroke" />
  <path d="M 160 0 C 115.8 0 80 35.8 80 80" class="lattice-stroke" />

  <!-- Bottom corners to (80,80) -->
  <path d="M 0 160 C 44.2 160 80 124.2 80 80" class="lattice-stroke" />
  <path d="M 160 160 C 115.8 160 80 124.2 80 80" class="lattice-stroke" />

  <!-- Elegant inner echo lines for luxury depth -->
  <path d="M 12 80 C 12 42.4 42.4 12 80 12 C 117.6 12 148 42.4 148 80" class="lattice-accent" />
  <path d="M 12 80 C 12 117.6 42.4 148 80 148 C 117.6 148 148 117.6 148 80" class="lattice-accent" />
</svg>
